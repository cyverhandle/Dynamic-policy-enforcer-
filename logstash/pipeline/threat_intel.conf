input {
  # Receive from Python application via TCP
  tcp {
    port => 5000
    codec => json
    type => "threat_intel"
  }
  
  # Also read from MongoDB change stream (via Python bridge)
  http {
    port => 8080
    codec => json
  }
}

filter {
  # Parse and normalize data
  if [type] == "threat_intel" {
    # Parse timestamp
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }
    
    # Calculate risk level
    mutate {
      add_field => {
        "[risk_level]" => "%{[risk_score]}"
      }
    }
    
    mutate {
      add_tag => "threat_intel"
    }
    
    # Enrich with geoip if IP
    if [threat_type] == "ip" {
      geoip {
        source => "indicator"
        target => "geoip"
        database => "/usr/share/logstash/GeoLite2-City.mmdb"
      }
    }
    
    # Mutate fields for better searchability
    mutate {
      rename => {
        "source_feeds" => "feeds"
        "first_seen" => "first_seen_timestamp"
        "last_seen" => "last_seen_timestamp"
      }
    }
  }
}

output {
  # Send to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "threat-intel-%{+YYYY.MM.dd}"
    document_type => "_doc"
  }
  
  # Also output to stdout for debugging
  stdout {
    codec => rubydebug
  }
}